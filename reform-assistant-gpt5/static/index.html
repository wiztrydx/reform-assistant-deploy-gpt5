<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>リフォーム提案アシスタント - リフォーム熊本</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans JP', sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            min-height: 100vh;
            color: #1e293b;
            overflow-x: hidden;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            min-height: 100vh;
            box-shadow: 0 0 30px rgba(0,0,0,0.1);
            position: relative;
        }

        /* ロゴセクション */
        .logo-section {
            background: white;
            padding: 1rem 2rem;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo-item {
            display: flex;
            align-items: center;
            opacity: 0.9;
            transition: opacity 0.3s ease;
        }

        .logo-item:hover {
            opacity: 1;
        }

        .logo-rehome {
            height: 40px;
            width: auto;
        }

        .logo-rinozent {
            height: 45px;
            width: auto;
        }

        .powered-by {
            font-size: 0.75rem;
            color: #64748b;
            margin-right: 0.5rem;
            font-weight: 500;
        }

        /* ヘッダー - 高さを調整してURL表示領域を確保 */
        .header {
            background: linear-gradient(135deg, #3b82f6 0%, #ef4444 100%);
            color: white;
            padding: 3rem 2rem 2rem 2rem;
            text-align: center;
            position: relative;
            overflow: hidden;
            margin-top: 1rem;
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="grid" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M 10 0 L 0 0 0 10" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/></pattern></defs><rect width="100" height="100" fill="url(%23grid)"/></svg>');
            opacity: 0.3;
        }

        .header-content {
            position: relative;
            z-index: 1;
        }

        .header h1 {
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
            font-weight: 700;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
            font-weight: 300;
        }

        /* YouTube動画セクション */
        .video-section {
            padding: 2rem;
            background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
            border-bottom: 1px solid #e2e8f0;
        }

        .video-title {
            text-align: center;
            font-size: 1.3rem;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .video-container {
            position: relative;
            width: 100%;
            max-width: 560px;
            margin: 0 auto;
            aspect-ratio: 16 / 9;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* プログレス */
        .progress-section {
            padding: 1.5rem 2rem;
            background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
            border-bottom: 1px solid #e2e8f0;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #e2e8f0;
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 1rem;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6 0%, #ef4444 100%);
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 3px;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            color: #64748b;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .step-indicator {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-weight: 500;
            color: #1e293b;
            min-width: 0;
        }

        .step-icon {
            width: 24px;
            height: 24px;
            fill: #3b82f6;
            flex-shrink: 0;
        }

        .step-name {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* メインコンテンツ */
        .content {
            padding: 2.5rem 2rem;
        }

        .section-card {
            background: white;
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            border: 1px solid #f1f5f9;
            transition: all 0.3s ease;
        }

        .section-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 1rem;
            font-size: 1.4rem;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 0.5rem;
            flex-wrap: wrap;
        }

        .section-description {
            color: #64748b;
            margin-bottom: 2rem;
            font-size: 1rem;
            line-height: 1.6;
        }

        /* フォーム要素 */
        .form-group {
            background: #f8fafc;
            padding: 1.5rem;
            border-radius: 12px;
            margin-bottom: 2rem;
            border: 1px solid #e2e8f0;
        }

        .form-group h3 {
            color: #3b82f6;
            font-size: 1.2rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .checkbox-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 0.75rem;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1.2rem;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            background: white;
            font-size: 1rem;
            user-select: none;
            min-height: 60px;
            word-wrap: break-word;
        }

        .checkbox-item:hover {
            border-color: #3b82f6;
            background: #eff6ff;
            transform: translateY(-1px);
        }

        .checkbox-item.checked {
            border-color: #3b82f6;
            background: linear-gradient(135deg, #dbeafe 0%, #fef2f2 100%);
        }

        .checkbox-item input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: #3b82f6;
            pointer-events: none;
            flex-shrink: 0;
        }

        .checkbox-item label {
            font-weight: 500;
            color: #1e293b;
            cursor: pointer;
            flex: 1;
            pointer-events: none;
            line-height: 1.4;
        }

        .select-group {
            margin-bottom: 1.5rem;
        }

        .select-group label {
            display: block;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 0.5rem;
            font-size: 1rem;
        }

        .select-group select {
            width: 100%;
            padding: 1rem 1.2rem;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1.1rem;
            background: white;
            cursor: pointer;
            transition: all 0.2s ease;
            min-height: 50px;
        }

        .select-group select:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
            background: #eff6ff;
        }

        .textarea-group {
            margin-bottom: 1.5rem;
        }

        .textarea-group label {
            display: block;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 0.5rem;
            font-size: 1rem;
        }

        .textarea-group textarea {
            width: 100%;
            padding: 1.2rem;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1rem;
            font-family: inherit;
            resize: vertical;
            min-height: 120px;
            transition: all 0.2s ease;
            background: white;
        }

        .textarea-group textarea:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
            background: #eff6ff;
        }

        /* ナビゲーション */
        .navigation {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2rem;
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            border-top: 1px solid #e2e8f0;
            gap: 1rem;
        }

        .btn {
            padding: 0.875rem 2rem;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            position: relative;
            overflow: hidden;
            min-height: 50px;
            justify-content: center;
            white-space: nowrap;
        }

        .btn-primary {
            background: linear-gradient(135deg, #3b82f6 0%, #ef4444 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.4);
        }

        .btn-secondary {
            background: #64748b;
            color: white;
        }

        .btn-secondary:hover {
            background: #475569;
            transform: translateY(-1px);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        /* チャット画面 */
        .chat-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            margin-top: 1rem;
        }

        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 2rem;
            background: linear-gradient(135deg, #3b82f6 0%, #ef4444 100%);
            color: white;
            flex-shrink: 0;
        }

        .chat-title {
            display: flex;
            align-items: center;
            gap: 1rem;
            font-size: 1.2rem;
            font-weight: 600;
            min-width: 0;
        }

        .chat-avatar {
            width: 40px;
            height: 40px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .chat-title-text {
            min-width: 0;
        }

        .chat-title-main {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-title-sub {
            font-size: 0.8rem;
            opacity: 0.8;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 2rem;
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            position: relative;
            padding-bottom: 6rem;
            -webkit-overflow-scrolling: touch;
        }

        .message {
            margin-bottom: 1.5rem;
            display: flex;
            align-items: flex-start;
            gap: 1rem;
            max-width: 100%;
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .message.assistant .message-avatar {
            background: linear-gradient(135deg, #3b82f6 0%, #ef4444 100%);
            color: white;
        }

        .message.user .message-avatar {
            background: #64748b;
            color: white;
        }

        .message-content {
            max-width: 75%;
            padding: 1.25rem 1.5rem;
            border-radius: 20px;
            white-space: pre-wrap;
            line-height: 1.6;
            position: relative;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .message.user .message-content {
            background: linear-gradient(135deg, #3b82f6 0%, #60a5fa 100%);
            color: white;
        }

        .message.assistant .message-content {
            background: white;
            border: 1px solid #e2e8f0;
            color: #1e293b;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        /* メッセージ内のリンクをクリック可能にする */
        .message-content a {
            color: #3b82f6;
            text-decoration: underline;
            word-break: break-all;
        }

        .message.assistant .message-content a {
            color: #3b82f6;
        }

        .message.user .message-content a {
            color: #dbeafe;
        }

        .loading-message {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1.25rem 1.5rem;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            max-width: 75%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .loading-spinner {
            width: 20px;
            height: 20px;
            border: 2px solid #e2e8f0;
            border-top: 2px solid #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .chat-input-container {
            padding: 1.5rem 2rem;
            background: white;
            border-top: 1px solid #e2e8f0;
            display: flex;
            gap: 1rem;
            position: relative;
            flex-shrink: 0;
        }

        .chat-input {
            flex: 1;
            padding: 1rem 1.5rem;
            border: 2px solid #e2e8f0;
            border-radius: 25px;
            font-size: 1rem;
            outline: none;
            transition: all 0.2s ease;
            min-height: 50px;
        }

        .chat-input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .send-btn {
            padding: 1rem 1.5rem;
            background: linear-gradient(135deg, #3b82f6 0%, #ef4444 100%);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            position: relative;
            overflow: hidden;
            min-height: 50px;
            min-width: 100px;
            justify-content: center;
            flex-shrink: 0;
        }

        .send-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.3);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .send-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: all 0.3s ease;
        }

        .send-btn:active::before {
            width: 100px;
            height: 100px;
        }

        /* ホバー問い合わせボタン - 送信ボタンの少し上に配置 */
        .contact-button {
            position: absolute;
            bottom: 5.5rem;
            right: 2rem;
            padding: 1rem 1.5rem;
            background: white;
            border: 2px solid #3b82f6;
            border-radius: 25px;
            color: #3b82f6;
            text-decoration: none;
            font-weight: 600;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            opacity: 0;
            transform: translateX(20px);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            z-index: 1000;
            white-space: nowrap;
            min-height: 50px;
        }

        .contact-button.show {
            opacity: 1;
            transform: translateX(0);
        }

        .contact-button:hover {
            background: linear-gradient(135deg, #3b82f6 0%, #ef4444 100%);
            color: white;
            transform: translateX(-3px);
            box-shadow: 0 12px 35px rgba(59, 130, 246, 0.4);
        }

        .hidden {
            display: none;
        }

        /* レスポンシブデザイン - より詳細な対応 */
        @media (max-width: 768px) {
            .container {
                margin: 0;
                border-radius: 0;
            }

            .logo-section {
                padding: 0.75rem 1rem;
                flex-direction: column;
                gap: 0.75rem;
            }

            .logo-rehome {
                height: 35px;
            }

            .logo-rinozent {
                height: 40px;
            }

            .header {
                padding: 2rem 1rem 1.5rem 1rem;
                margin-top: 0.5rem;
            }

            .header h1 {
                font-size: 1.6rem;
                line-height: 1.2;
            }

            .header p {
                font-size: 1rem;
            }

            .video-section {
                padding: 1.5rem 1rem;
            }

            .video-title {
                font-size: 1.1rem;
                margin-bottom: 1rem;
            }

            .progress-section {
                padding: 1rem;
            }

            .progress-info {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.5rem;
            }

            .step-indicator {
                width: 100%;
            }

            .content {
                padding: 1.5rem 1rem;
            }

            .section-card {
                padding: 1.5rem;
                margin-bottom: 1.5rem;
            }

            .section-title {
                font-size: 1.2rem;
                gap: 0.5rem;
            }

            .navigation {
                padding: 1.5rem 1rem;
                flex-direction: column;
                gap: 1rem;
            }

            .btn {
                width: 100%;
                padding: 1rem 2rem;
                font-size: 1.1rem;
            }

            .checkbox-grid {
                grid-template-columns: 1fr;
            }

            .checkbox-item {
                padding: 1rem;
                min-height: 55px;
            }

            .checkbox-item input[type="checkbox"] {
                width: 18px;
                height: 18px;
            }

            .form-group h3 {
                font-size: 1.1rem;
            }

            .chat-header {
                padding: 1rem;
            }

            .chat-title {
                font-size: 1rem;
                gap: 0.75rem;
            }

            .chat-avatar {
                width: 36px;
                height: 36px;
            }

            .chat-messages {
                padding: 1rem;
                padding-bottom: 5rem;
            }

            .message-content {
                max-width: 85%;
                padding: 1rem 1.25rem;
            }

            .chat-input-container {
                padding: 1rem;
                gap: 0.75rem;
            }

            .chat-input {
                font-size: 16px; /* iOS zoom prevention */
                min-height: 45px;
            }

            .send-btn {
                min-width: 80px;
                min-height: 45px;
                padding: 0.75rem 1rem;
            }

            .contact-button {
                bottom: 4.5rem;
                right: 1rem;
                padding: 0.75rem 1rem;
                font-size: 0.9rem;
                min-height: 45px;
            }
        }

        @media (max-width: 480px) {
            .logo-section {
                padding: 0.5rem;
            }

            .logo-rehome {
                height: 30px;
            }

            .logo-rinozent {
                height: 35px;
            }

            .header h1 {
                font-size: 1.4rem;
            }

            .section-title {
                font-size: 1.1rem;
            }

            .checkbox-item {
                padding: 0.875rem;
                min-height: 50px;
            }

            .checkbox-item label {
                font-size: 0.95rem;
            }

            .message-content {
                max-width: 90%;
                padding: 0.875rem 1rem;
            }

            .contact-button {
                font-size: 0.85rem;
                padding: 0.625rem 0.875rem;
            }
        }

        /* 横向きスマホ対応 */
        @media (max-width: 768px) and (orientation: landscape) {
            .header {
                padding: 1.5rem 1rem 1rem 1rem;
            }

            .video-section {
                padding: 1rem;
            }

            .chat-container {
                height: 100vh;
            }

            .chat-messages {
                padding: 0.75rem;
                padding-bottom: 4rem;
            }

            .contact-button {
                bottom: 3.5rem;
            }
        }

        /* アニメーション */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .section-card {
            animation: fadeInUp 0.6s ease-out;
        }

        /* アイコン用のSVG */
        .icon {
            width: 24px;
            height: 24px;
            fill: currentColor;
            flex-shrink: 0;
        }

        /* タッチデバイス用の改善 */
        @media (hover: none) and (pointer: coarse) {
            .checkbox-item:hover {
                transform: none;
            }
            
            .btn:hover {
                transform: none;
            }
            
            .contact-button:hover {
                transform: translateX(0);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- ヒアリング画面 -->
        <div id="hearing-screen">
            <!-- ロゴセクション -->
            <div class="logo-section">
                <div class="logo-item">
                    <img src="/static/logo-rehome.png" class="logo-rehome" alt="リホーム熊本">
                </div>
                <div class="logo-item">
                    <span class="powered-by">Powered by</span>
                    <img src="/static/logo-rinozent.png" class="logo-rinozent" alt="リノゼント">
                </div>
            </div>

            <!-- ヘッダー -->
            <div class="header">
                <div class="header-content">
                    <h1>🏠 リフォーム提案アシスタント</h1>
                    <p>あなたの理想の住まいを一緒に考えます</p>
                </div>

        // 初期化
        function init() {
            updateStepContent();
            updateProgress();
            updateNavigation();

        // ステップ内容更新
        function updateStepContent() {
            const stepContent = document.getElementById('step-content');
            const step = steps[currentStep - 1];
            
            stepContent.innerHTML = `
                <div class="section-title">
                    ${step.title}
                </div>
                <div class="section-description">
                    ${step.description}
                </div>
                ${step.content}
            `;

            // チェックボックスのイベントリスナーを設定
            setupCheckboxListeners();
            
            // セレクトボックスのイベントリスナーを設定
            setupSelectListeners();
            
            // テキストエリアのイベントリスナーを設定
            setupTextareaListeners();

            // 保存されたデータを復元
            restoreFormData();
        }

        // チェックボックスのイベントリスナー設定
        function setupCheckboxListeners() {
            const checkboxItems = document.querySelectorAll('.checkbox-item');
            checkboxItems.forEach(item => {
                item.addEventListener('click', function() {
                    const checkbox = this.querySelector('input[type="checkbox"]');
                    const field = this.dataset.field;
                    const value = this.dataset.value;
                    
                    // 同じフィールドの他のチェックボックスをクリア（単一選択）
                    const sameFieldItems = document.querySelectorAll(`[data-field="${field}"]`);
                    sameFieldItems.forEach(otherItem => {
                        if (otherItem !== this) {
                            otherItem.classList.remove('checked');
                            otherItem.querySelector('input[type="checkbox"]').checked = false;
                        }
                    });
                    
                    // 現在のアイテムをトグル
                    const isChecked = !checkbox.checked;
                    checkbox.checked = isChecked;
                    
                    if (isChecked) {
                        this.classList.add('checked');
                        hearingData[field] = value;
                    } else {
                        this.classList.remove('checked');
                        delete hearingData[field];
                    }
                });
            });
        }

        // セレクトボックスのイベントリスナー設定
        function setupSelectListeners() {
            const selects = document.querySelectorAll('select[data-field]');
            selects.forEach(select => {
                select.addEventListener('change', function() {
                    const field = this.dataset.field;
                    const value = this.value;
                    
                    if (value) {
                        hearingData[field] = value;
                    } else {
                        delete hearingData[field];
                    }
                });
            });
        }

        // テキストエリアのイベントリスナー設定
        function setupTextareaListeners() {
            const textareas = document.querySelectorAll('textarea[data-field]');
            textareas.forEach(textarea => {
                textarea.addEventListener('input', function() {
                    const field = this.dataset.field;
                    const value = this.value.trim();
                    
                    if (value) {
                        hearingData[field] = value;
                    } else {
                        delete hearingData[field];
                    }
                });
            });
        }

        // フォームデータ復元
        function restoreFormData() {
            // チェックボックス復元
            Object.keys(hearingData).forEach(field => {
                const value = hearingData[field];
                const item = document.querySelector(`[data-field="${field}"][data-value="${value}"]`);
                if (item) {
                    item.classList.add('checked');
                    item.querySelector('input[type="checkbox"]').checked = true;
                }
            });

            // セレクトボックス復元
            const selects = document.querySelectorAll('select[data-field]');
            selects.forEach(select => {
                const field = select.dataset.field;
                if (hearingData[field]) {
                    select.value = hearingData[field];
                }
            });

            // テキストエリア復元
            const textareas = document.querySelectorAll('textarea[data-field]');
            textareas.forEach(textarea => {
                const field = textarea.dataset.field;
                if (hearingData[field]) {
                    textarea.value = hearingData[field];
                }
            });
        }

        // プログレス更新
        function updateProgress() {
            const progress = (currentStep / totalSteps) * 100;
            const progressFill = document.getElementById('progress-fill');
            const progressText = document.getElementById('progress-text');
            const stepName = document.getElementById('step-name');
            
            progressFill.style.width = progress + '%';
            progressText.textContent = Math.round(progress) + '%';
            stepName.textContent = `ステップ ${currentStep} / ${totalSteps}`;
        }

        // ナビゲーション更新
        function updateNavigation() {
            const prevBtn = document.getElementById('prev-btn');
            const nextBtn = document.getElementById('next-btn');
            
            prevBtn.disabled = currentStep === 1;
            
            if (currentStep === totalSteps) {
                nextBtn.textContent = 'チャット開始 💬';
            } else {
                nextBtn.textContent = '次へ →';
            }
        }

        // 次のステップ
        function nextStep() {
            if (currentStep < totalSteps) {
                currentStep++;
                updateStepContent();
                updateProgress();
                updateNavigation();
            } else {
                // ヒアリング完了、チャット画面へ
                startChat();
            }
        }

        // 前のステップ
        function previousStep() {
            if (currentStep > 1) {
                currentStep--;
                updateStepContent();
                updateProgress();
                updateNavigation();
            }
        }

        // チャット開始
        function startChat() {
            document.getElementById('hearing-screen').classList.add('hidden');
            document.getElementById('chat-screen').classList.remove('hidden');
            
            // 初回メッセージを送信
            sendInitialMessage();
            
            // ホバーボタンの表示設定
            setupContactButton();
        }

        // 初回メッセージ送信
        async function sendInitialMessage() {
            const chatMessages = document.getElementById('chat-messages');
            
            // ローディング表示
            showLoadingMessage();
            
            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: 'ヒアリング完了',
                        hearing_data: hearingData,
                        is_initial: true
                    })
                });
                
                const data = await response.json();
                
                // ローディング削除
                removeLoadingMessage();
                
                // アシスタントのメッセージを表示
                addMessage('assistant', data.response);
                
            } catch (error) {
                console.error('Error:', error);
                removeLoadingMessage();
                addMessage('assistant', 'エラーが発生しました。もう一度お試しください。');
            }
        }

        // メッセージ送信
        async function sendMessage() {
            const chatInput = document.getElementById('chat-input');
            const message = chatInput.value.trim();
            
            if (!message) return;
            
            // ユーザーメッセージを表示
            addMessage('user', message);
            chatInput.value = '';
            
            // チャット回数をカウント
            chatCount++;
            
            // ローディング表示
            showLoadingMessage();
            
            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: message,
                        hearing_data: hearingData,
                        chat_count: chatCount
                    })
                });
                
                const data = await response.json();
                
                // ローディング削除
                removeLoadingMessage();
                
                // アシスタントのメッセージを表示
                addMessage('assistant', data.response);
                
            } catch (error) {
                console.error('Error:', error);
                removeLoadingMessage();
                addMessage('assistant', 'エラーが発生しました。もう一度お試しください。');
            }
        }

        // メッセージ追加
        function addMessage(sender, content) {
            const chatMessages = document.getElementById('chat-messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            
            const avatar = sender === 'user' ? '👤' : '🏠';
            
            // URLを自動的にリンクに変換
            const linkedContent = linkifyContent(content);
            
            messageDiv.innerHTML = `
                <div class="message-avatar">${avatar}</div>
                <div class="message-content">${linkedContent}</div>
            `;
            
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // URLをリンクに変換
        function linkifyContent(text) {
            const urlRegex = /(https?:\/\/[^\s]+)/g;
            return text.replace(urlRegex, '<a href="$1" target="_blank">$1</a>');
        }

        // ローディングメッセージ表示
        function showLoadingMessage() {
            const chatMessages = document.getElementById('chat-messages');
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message assistant';
            loadingDiv.id = 'loading-message';
            
            loadingDiv.innerHTML = `
                <div class="message-avatar">🏠</div>
                <div class="loading-message">
                    <div class="loading-spinner"></div>
                    <span>考え中...</span>
                </div>
            `;
            
            chatMessages.appendChild(loadingDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // ローディングメッセージ削除
        function removeLoadingMessage() {
            const loadingMessage = document.getElementById('loading-message');
            if (loadingMessage) {
                loadingMessage.remove();
            }
        }

        // キー押下処理
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        // 問い合わせボタンの設定
        function setupContactButton() {
            const chatMessages = document.getElementById('chat-messages');
            const contactButton = document.getElementById('contact-button');
            
            let hoverTimer;
            
            chatMessages.addEventListener('mouseenter', function() {
                hoverTimer = setTimeout(() => {
                    contactButton.classList.add('show');
                }, 500);
            });
            
            chatMessages.addEventListener('mouseleave', function() {
                clearTimeout(hoverTimer);
                contactButton.classList.remove('show');
            });
        }

        // 初期化実行
        init();
    </script>
</body>
</html>
